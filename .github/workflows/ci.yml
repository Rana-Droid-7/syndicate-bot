# CI — typecheck, build, unit tests, and integration harness on every
# push/PR. No Discord credentials needed: tests use throwaway DBs and
# mock the API surface.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder credentials: several verification steps import the
      # config module, which requires these to exist at load time. No
      # real values are needed or used by any test or harness.
      DISCORD_TOKEN: x
      CLIENT_ID: "123456789012345678"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS (Krypton): better-sqlite3@13 requires node >=22
          # (Node 20 segfaults). 24 is the active LTS line — same
          # requirement, longer security runway.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test --test-reporter=spec dist/tests/unit.test.js

      - name: Timer verification (safeSetTimeout chaining)
        run: node verify_timer.mjs

      - name: Lookup engine verification
        run: node verify_lookup.mjs

      - name: Dispatcher edge-cases
        run: node verify-dispatcher.mjs

      - name: Integration + attack harness
        run: node verify-integration.mjs

      - name: Embed output verification (Discord hard limits)
        run: node verify-embeds.mjs
