# GitLab CI — same verification loop as the GitHub workflow.

stages:
  - verify

verify:
  stage: verify
  image: node:20
  variables:
    # Placeholder credentials: several verification steps import the
    # config module, which requires these at load time. No real
    # values are needed or used by any test or harness.
    DISCORD_TOKEN: x
    CLIENT_ID: "123456789012345678"
  cache:
    key: npm
    paths:
      - .npm/
  script:
    - npm ci --cache .npm
    - npx tsc --noEmit
    - npm run build
    - node --test --test-reporter=spec dist/tests/unit.test.js
    - node verify_timer.mjs
    - node verify_lookup.mjs
    - node verify-dispatcher.mjs
    - node verify-integration.mjs
